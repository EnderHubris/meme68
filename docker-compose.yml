services:
  db:
    image: mysql:latest
    container_name: meme68_db
    expose: # do not open port(s) on HOST
      - "3306"
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER}", "-p${DB_PASS}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_internal

  app:
    container_name: meme68_web
    ports: # open port(s) on HOST
      - "80:80"
      - "443:443"
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - uploads:/var/www/project/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_internal

volumes:
  db_data:
  uploads:

networks:
  app_internal: