<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #121212;
            color: #f0f0f0;
            font-family: 'Poppins', sans-serif;
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #4070ff;
        }

        .card {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            background: #1e1e1e;
            border: none;
            border-radius: 0.75rem;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            height: 300px; /* uniform card height */
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(233, 69, 4, 0.4);
        }

        .card-img-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            overflow: hidden;
        }

        .card-img-top {
            width: 100%;
            height: 100%;
            object-fit: contain; /* ensures full image fits */
            display: block;
        }

        .card-body {
            padding: 0.5rem 0.75rem;
            background: #1a1a1a;
            text-align: center;
        }

        .card-text {
            font-size: 0.9rem;
            color: #ec4df4;
            word-break: break-word;
        }

        .col.d-flex {
            display: flex;
        }

        a {
            text-decoration: none;
        }

        /* Optional: adjust grid gap for bigger screens */
        @media (min-width: 768px) {
            .row.g-3 {
                gap: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="container my-4">
        <h1>Meme Gallery</h1>
        <div id="card-container" class="row g-3"></div>
    </div>

    <script>
        // needed for github pages
        const base = window.location.pathname.replace(/\/[^/]*$/, '/');
        let jsonFile = "/images.json";

        if (base !== "/") {
            jsonFile = base + "/images.json";
        }

        fetch(jsonFile)
            .then(res => res.json())
            .then(images => {
                const container = document.getElementById('card-container');
                images.forEach(src => {
                    const col = document.createElement('div');
                    col.className = 'col-6 col-sm-4 col-md-3 col-lg-2 col-xl-2 d-flex';

                    const card = document.createElement('div');
                    card.className = 'card w-100';

                    const link = document.createElement('a');
                    link.href = `/images/${src}`;
                    if (base !== "/") {
                        link.href = base + `/images/${src}`;
                    }
                    link.target = "_blank";

                    // Image wrapper to maintain uniform height
                    const imgWrapper = document.createElement('div');
                    imgWrapper.className = 'card-img-wrapper';

                    const img = document.createElement('img');

                    img.src = `/images/${src}`;
                    if (base !== "/") {
                        img.src = base + `/images/${src}`;
                    }

                    img.alt = src;
                    img.className = 'card-img-top';

                    imgWrapper.appendChild(img);
                    link.appendChild(imgWrapper);

                    const body = document.createElement('div');
                    body.className = 'card-body';
                    body.innerHTML = `<p class="card-text">${src}</p>`;

                    card.appendChild(link);
                    card.appendChild(body);
                    col.appendChild(card);
                    container.appendChild(col);
                });
            })
            .catch(err => console.error('Failed to load images:', err));
    </script>
</body>

</html>
